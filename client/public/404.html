<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Shelf — Board Game Companion</title>
    <script>
      // GitHub Pages has no server-side routing, so it serves this 404 page for
      // any unknown path (e.g. a deep link or a refresh on /collection). Encode
      // the requested path into a query string and bounce to index.html, which
      // restores it via the History API. https://github.com/rafgraph/spa-github-pages
      (function () {
        var pathSegmentsToKeep = 1; // project page: keep "/BoardGameCompanion"
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
